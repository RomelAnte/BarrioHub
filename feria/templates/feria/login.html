{% extends 'feria/base.html' %}

{% block title %}Iniciar Sesión — Feria de Seguridad 2026{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 450px;">
    <div class="card card-custom bg-white p-4 p-md-5 shadow-lg border-top border-4 border-primary">
        <div class="text-center mb-4">
            <div class="p-3 bg-primary bg-opacity-10 text-primary rounded-circle d-inline-block mb-3" style="width: 70px; height: 70px; padding: 15px 0;">
                <i class="bi bi-shield-lock-fill fs-2"></i>
            </div>
            <h3 class="fw-bold mb-1">Acceso Comité</h3>
            <p class="text-muted small">Ingresa con tus credenciales de administración</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger py-2 small rounded-3 mb-3">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person-fill text-muted"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Ej. admin" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key-fill text-muted"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-brand btn-lg w-100 fw-bold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar al Panel
            </button>
        </form>


    </div>
</div>
{% endblock %}
